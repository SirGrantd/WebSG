$kind: http-request
name: Stream SSE
description: "Abre o fluxo contínuo de Server-Sent Events (SSE) para o canal especificado"
url: http://localhost:{{port}}/v1/stream?channel=default
method: GET
headers:
  Accept: text/event-stream
queryParams:
  channel: default
settings:
  disabledSystemHeaders:
    - user-agent
order: 4000
